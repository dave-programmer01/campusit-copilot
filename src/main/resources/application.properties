spring.application.name=campusit-copilot

# --- Postgres ---
spring.datasource.url=jdbc:postgresql://ep-wild-haze-a585wrrt-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# --- OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.chat.model=gpt-4o


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# --- pgvector store ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

# --- Internal endpoint protection ---
# Set a secret so /ingest and /search require the X-Internal-Api-Key header (the student-facing /chat stays open).
app.internal.api-key=${APP_INTERNAL_API_KEY}

# --- Rate limiting ---
# Per-IP token bucket rate limiting for the public /chat endpoint.
app.rate-limit.enabled=true
app.rate-limit.chat.capacity=20
app.rate-limit.chat.refill-tokens=20
app.rate-limit.chat.refill-duration-seconds=60

# --- One-off ingestion toggle ---
# Keep this false so guides are NOT re-ingested on every boot (avoids duplicate vectors).
# Flip to true for a single run, or POST /ingest to trigger it manually.
app.ingest.on-startup=false

# --- CORS ---
# Allowed frontend origins for CORS (comma-separated). Set via env var APP_CORS_ALLOWED_ORIGIN.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000,https://campusit-copilot.vercel.app}

server.port=${PORT:8080}
